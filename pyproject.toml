[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "juno-agent-toolkit"
version = "0.1.0a1"
description = "Experimental public Python client and agent research workflow for Juno"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Juno"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://www.heyjuno.co"
Repository = "https://github.com/hey-juno/juno-agent-toolkit"
Documentation = "https://www.heyjuno.co/documents/developers-overview"

[tool.setuptools.packages.find]
include = ["juno_client*"]
